[tool.poetry]
name = "pestdataprocess"
version = "0.1.0"
description = ""
authors = ["Ryan Zhang <ryanzhang106@gmail.com>"]
license = "MIT"
repository = "https://github.com/ryanz22/PestDataproces.git"
packages = [
	{ include = "dataprocess" }
]

[tool.poetry.dependencies]
python = "~3.10"
PyYAML = { version="^6.0" }
pandas = { version="1.4.2" }
jupyter = { version="1.0.0" }
matplotlib = { version="3.5.3" }
scipy = { version="1.9.3" }
PyWavelets = { version="1.3.0" }
"mpl-toolkits.clifford" = { version="^0.0.3" }
numpy = { version="1.23.5" }
librosa = { version="0.9.2" }
scaleogram = { git = "https://github.com/alsauve/scaleogram.git", branch = "master" }
seaborn = { version="0.12.0" }
spkit = { version="^0.0.9" }
opencv-python = { version="4.6.0.66" }
split-image = { version="^1.4.0" }
SoundFile = { version="^0.10.3" }
noisereduce = { version="^2.0.1" }
colorspacious = { version="^1.1.2" }
pycairo = { version="^1.21.0" }
PyGObject = { version="^3.42.2" }
pyfunctional = { version="^1.4.3" }
requests = { version= "^2.28.1" }
httpx = { version="^0.23.0" }
click = "^8.1.3"
scikit-learn = "1.1.2"
#nussl = "^1.1.9"
scaper = "^1.6.5"
ffmpeg-python = "^0.2.0"
rembg = "^2.0.30"
split-folders = "^0.5.1"
audiomentations = "^0.28.0"
pydub = "^0.25.1"
peakdetect = "^1.2"

[tool.poetry.dev-dependencies]

[tool.poetry.group.dev.dependencies]
black = {version = "^22.10.0", allow-prereleases = true}
pylint = "^2.15.5"
pytest = "^7.2.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

