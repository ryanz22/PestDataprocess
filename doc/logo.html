<html>
	<head>
		<style>
			/* Three image containers (use 25% for four, and 50% for two, etc) */
			.column {
				float: left;
				width: 50%;
				padding: 5px;
			}
			
			/* Clear floats after image containers */
			.row::after {
				content: "";
				clear: both;
				display: table;
			}
		</style>
	</head>
	<body>
		<div class="row">
			<div class="column">
				<img src="grasshopper.svg" alt="grasshopper SVG" style="width:150;height:100"/>
			</div>
			<div class="col">
				<img src="PEDS-AI.svg" alt="PEDS-AI"/>
			</div>
		</div>
	</body>
</html>
